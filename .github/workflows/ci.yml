name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run build
  api-syntax:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/interviewos_ci
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: cd server && npm install
      - run: cd server && npm audit --audit-level=high
      - run: cd server && npm test
      - run: |
          node --check server/src/index.js
          node --check server/src/models/User.js
          node --check server/src/models/Interview.js
          node --check server/src/middleware/auth.js
          node --check server/src/routes/auth.js
          node --check server/src/routes/interviews.js
  ai-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile ai-service/main.py ai-service/test_main.py
      - run: pip install -r ai-service/requirements.txt
      - run: python -m unittest discover -s ai-service -p 'test_*.py'
